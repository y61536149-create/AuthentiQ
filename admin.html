<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuthentiQ - Founder Admin Control Room</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
          <i class="fa-solid fa-crown text-xl"></i>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight text-white">Authenti<span class="text-amber-400">Q</span></span>
          <span class="ml-2 text-xs font-semibold px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">Control Room</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
          <i class="fa-solid fa-arrow-left mr-1"></i> Public Storefront
        </a>
        <button onclick="loadAdminData()" class="text-xs px-3 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-500/30 transition">
          <i class="fa-solid fa-rotate-right mr-1"></i> Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-8">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
      <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-emerald-400"></i> Direct Insert Guaranteed Brand
      </h2>
      <form onsubmit="handleDirectBrandAdd(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <input required id="newBrandName" placeholder="Brand Name (e.g. Dyson)" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white" />
        <input required id="newBrandUrl" placeholder="Website (https://...)" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white" />
        <input required id="newBrandCin" placeholder="CIN / GSTIN / Reg No" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white" />
        <select id="newBrandSector" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
          <option value="1">Technology & Electronics</option>
          <option value="2">Health & Skincare</option>
          <option value="3">Fashion & Apparel</option>
          <option value="4">Food & Consumables</option>
          <option value="5">Home & Living</option>
        </select>
        <input required id="newBrandRank" type="number" min="1" placeholder="Sequential Rank (#1, #2...)" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-white" />
        <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg text-xs py-2.5 transition">
          Publish to Registry
        </button>
      </form>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
      <h2 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
        <i class="fa-solid fa-file-signature text-amber-400"></i> Pending Brand Applications
      </h2>
      <p class="text-xs text-slate-400 mb-4">Brands awaiting your verification audit.</p>
      <div id="applicationsList" class="space-y-3">
        <div class="text-xs text-slate-500">Checking for applications...</div>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
      <h2 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-red-400"></i> Inbound Scam & Fraud Alerts
      </h2>
      <p class="text-xs text-slate-400 mb-4">Counterfeit and phishing reports submitted by consumers.</p>
      <div id="scamList" class="space-y-3">
        <div class="text-xs text-slate-500">Checking scam alerts...</div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://yadcxfczozsydrexquev.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S-81oDv-dMWj8j0HsjrAoA_p_-c7TzJ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadAdminData() {
      const { data: apps } = await supabase.from('audit_submissions').select('*').order('submitted_at', { ascending: false });
      const appsContainer = document.getElementById('applicationsList');
      appsContainer.innerHTML = '';

      if (!apps || apps.length === 0) {
        appsContainer.innerHTML = '<div class="text-xs text-slate-500">No applications currently pending.</div>';
      } else {
        apps.forEach(app => {
          const card = document.createElement('div');
          card.className = "bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between sm:items-center gap-3";
          card.innerHTML = `
            <div>
              <div class="text-sm font-bold text-white">${app.brand_name}</div>
              <div class="text-xs text-emerald-400">${app.official_website}</div>
              <div class="text-[11px] text-slate-400 font-mono mt-1">Reg ID: ${app.corporate_id} | Email: ${app.contact_email}</div>
            </div>
            <div class="flex gap-2">
              <button onclick="approveAudit(${app.id}, '${app.brand_name}', '${app.official_website}', '${app.corporate_id}')" class="px-3 py-1.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-lg text-xs font-semibold">
                Approve & Seed
              </button>
            </div>
          `;
          appsContainer.appendChild(card);
        });
      }

      const { data: scams } = await supabase.from('scam_reports').select('*').order('reported_at', { ascending: false });
      const scamContainer = document.getElementById('scamList');
      scamContainer.innerHTML = '';

      if (!scams || scams.length === 0) {
        scamContainer.innerHTML = '<div class="text-xs text-slate-500">No scam alerts filed.</div>';
      } else {
        scams.forEach(scam => {
          const card = document.createElement('div');
          card.className = "bg-slate-950 p-4 rounded-xl border border-red-500/20";
          card.innerHTML = `
            <div class="text-xs font-bold text-red-400 mb-1">Target: ${scam.reported_brand_or_url}</div>
            <div class="text-xs text-slate-300 mb-2">${scam.incident_details}</div>
            <div class="text-[11px] text-slate-500 font-mono">Reporter: ${scam.reporter_email || 'Anonymous'}</div>
          `;
          scamContainer.appendChild(card);
        });
      }
    }

    async function handleDirectBrandAdd(e) {
      e.preventDefault();
      const name = document.getElementById('newBrandName').value.trim();
      const website = document.getElementById('newBrandUrl').value.trim();
      const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '-');
      const cin = document.getElementById('newBrandCin').value.trim();
      const rank = parseInt(document.getElementById('newBrandRank').value);
      const sectorId = parseInt(document.getElementById('newBrandSector').value);

      const { data: brand, error: bErr } = await supabase.from('brands').insert([{
        name, slug, official_website: website, is_guaranteed: true
      }]).select().single();

      if (bErr) { alert("Error adding brand: " + bErr.message); return; }

      await supabase.from('brand_verifications').insert([{
        brand_id: brand.id,
        reg_number: cin,
        audit_status: 'Approved'
      }]);

      await supabase.from('brand_category_rankings').insert([{
        category_id: sectorId,
        brand_id: brand.id,
        rank_position: rank,
        rank_rationale: 'Founder audited and certified.'
      }]);

      alert(`Success! ${name} is now certified and live at Rank #${rank}.`);
      e.target.reset();
      loadAdminData();
    }

    async function approveAudit(appId, name, website, cin) {
      const rank = prompt(`Enter sequential rank (#) for ${name}:`, "3");
      if (!rank) return;

      const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '-');

      const { data: brand, error: bErr } = await supabase.from('brands').insert([{
        name, slug, official_website: website, is_guaranteed: true
      }]).select().single();

      if (bErr) { alert("Error: " + bErr.message); return; }

      await supabase.from('brand_verifications').insert([{
        brand_id: brand.id,
        reg_number: cin,
        audit_status: 'Approved'
      }]);

      await supabase.from('brand_category_rankings').insert([{
        category_id: 1,
        brand_id: brand.id,
        rank_position: parseInt(rank),
        rank_rationale: 'Approved via corporate audit application.'
      }]);

      await supabase.from('audit_submissions').update({ status: 'Approved' }).eq('id', appId);

      alert(`${name} has been certified into the live registry!`);
      loadAdminData();
    }

    loadAdminData();
  </script>
</body>
</html>
